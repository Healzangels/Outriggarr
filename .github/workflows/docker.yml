name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  # The layer cache below freezes the apt layer until the Dockerfile changes, so
  # Debian's ffmpeg/OpenSSL security updates would never reach a running image.
  # This rebuilds that stage weekly and republishes latest.
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
    inputs:
      refresh_base:
        description: "Rebuild the runtime stage from scratch (picks up Debian security updates)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pytest -q
      - run: mkdir -p /tmp/ci-config && OUTRIGGARR_CONFIG_DIR=/tmp/ci-config uv run alembic upgrade head && OUTRIGGARR_CONFIG_DIR=/tmp/ci-config uv run alembic check

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: healzangels/outriggarr
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Build (local)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: outriggarr:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # A scheduled or hand-forced run rebuilds the runtime stage — apt, ffmpeg,
          # deno, the venv — instead of reusing cached layers. Only this build carries
          # the filter: the Push step below reads the cache this one just wrote, so what
          # ships is byte-for-byte what the smoke tests ran.
          no-cache-filters: ${{ (github.event_name == 'schedule' || inputs.refresh_base) && 'runtime' || '' }}
      - name: Smoke-run the image before it is pushed
        # the build stage proves the PO-token script; this proves the final image: the
        # app imports, ffmpeg/deno/node are on the path, the entrypoint drops privileges.
        # The versions are printed, not swallowed: a refresh run that silently reused the
        # cache (a no-cache-filters stage name that no longer matches the Dockerfile is
        # ignored, not an error) shows up here as an ffmpeg version that never moves.
        run: |
          docker run --rm -e PUID=99 -e PGID=100 outriggarr:ci sh -c '
            set -e
            python -c "import outriggarr.main"
            v=$(ffmpeg -version); echo "$v" | head -1
            v=$(deno --version); echo "$v" | head -1
            node /opt/bgutil/server/build/generate_once.js --help >/dev/null
            id -u | grep -qx 99
          '
      - name: Boot the image and ask it for its health
        # the lifespan is what production runs: migrations, the instance lock, the
        # worker and scheduler tasks; /health says whether both loops are alive
        run: |
          mkdir -p "$RUNNER_TEMP/cfg" "$RUNNER_TEMP/staging"
          docker run -d --name smoke -e PUID=99 -e PGID=100 -p 18080:8080 \
            -v "$RUNNER_TEMP/cfg:/config" -v "$RUNNER_TEMP/staging:/staging" outriggarr:ci
          for i in $(seq 1 30); do
            if body=$(curl -sf http://127.0.0.1:18080/health); then break; fi
            sleep 2
          done
          echo "$body"
          docker logs smoke | tail -20
          docker rm -f smoke >/dev/null
          echo "$body" | grep -q '"status":"ok"'
          echo "$body" | grep -q '"worker_alive":true'
          echo "$body" | grep -q '"scheduler_alive":true'
      - name: Push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
