{% extends "base.html" %}
{% block title %}Grab · Outriggarr{% endblock %}
{% block content %}
<div class="page-header">
  <div><h1>Grab</h1><p class="sub">Queue videos by hand: paste a URL, pick where each one goes, queue.</p></div>
</div>
{% if not connections %}
<p class="notice warn">No enabled connections. Add Sonarr or Radarr under <a href="/settings">Settings</a> first.</p>
{% endif %}
<div x-data="grabApp()" x-init="init()">
  <form @submit.prevent="resolve()">
    <fieldset role="group">
      <input type="url" x-model="url" placeholder="Video or playlist URL" aria-label="Video or playlist URL" required>
      <button type="submit" :aria-busy="resolving" :disabled="resolving">List videos</button>
    </fieldset>
  </form>
  <p class="notice bad" role="alert" x-show="error" x-text="error"></p>

  <template x-if="videos.length">
    <div>
      <article class="card">
      <header>Where they go <span class="muted">· connection, series, numbering</span></header>
      <div class="grid">
        <label>Send to
          <select x-model.number="connectionId" @change="connectionChanged()">
            {% for c in connections %}<option value="{{ c.id }}">{{ c.name }} ({{ c.kind.value }})</option>{% endfor %}
          </select>
        </label>
        <template x-if="kind === 'sonarr'">
          <div class="rel">
            <label>Series
              <input type="search" x-model="seriesQuery" @input.debounce.300ms="searchSeries()" placeholder="type to search Sonarr" autocomplete="off" role="combobox" aria-autocomplete="list" aria-controls="series-results" :aria-expanded="seriesResults.length > 0" :aria-activedescendant="seriesResults.length ? 'series-opt-' + hi : null" @keydown.down.prevent="hi = Math.min(hi + 1, seriesResults.length - 1)" @keydown.up.prevent="hi = Math.max(hi - 1, 0)" @keydown.enter.prevent="seriesResults[hi] && pickSeries(seriesResults[hi])" @keydown.escape="seriesResults = []">
            </label>
            <ul id="series-results" class="results" role="listbox" x-show="seriesResults.length" @click.outside="seriesResults = []">
              <template x-for="(s, i) in seriesResults" :key="s.id">
                <li role="option" :id="'series-opt-' + i" :aria-selected="i === hi" @mouseenter="hi = i" @click="pickSeries(s)"><span x-text="s.title"></span> <span class="muted" x-text="s.year ? '(' + s.year + ')' : ''"></span></li>
              </template>
            </ul>
          </div>
        </template>
      </div>
      <template x-if="kind === 'sonarr' && series">
        <div>
          <div class="grid">
            <label>Season
              <select x-model.number="bulk.season"><template x-for="s in seasons" :key="s"><option :value="s" x-text="'Season ' + s"></option></template></select>
            </label>
            <label>Start at episode
              <input type="number" min="0" x-model.number="bulk.start">
            </label>
            <div class="form-actions bulk-fill">
              <button type="button" class="secondary" @click="fillSequential()">Fill sequentially</button>
              <label class="inline-check" title="Number from the bottom of the list up, for playlists that list the newest video first"><input type="checkbox" x-model="bulk.reverse"> <span class="muted">newest first</span></label>
            </div>
          </div>
          <p class="muted" x-text="series.title + ' · ' + episodes.length + ' episodes in Sonarr'"></p>
        </div>
      </template>
      </article>

      <div class="table-wrap"><table class="grab">
        <thead><tr><th><input type="checkbox" aria-label="tick all" :checked="rows.length > 0 && rows.every(r => r.include)" @change="rows.forEach(r => { r.include = $event.target.checked; })"></th><th>#</th><th>Video</th><th x-text="kind === 'sonarr' ? 'Episode' : 'Movie'"></th><th>Status</th></tr></thead>
        <tbody>
          <template x-for="(row, i) in rows" :key="row.video.id">
            <tr>
              <td><input type="checkbox" x-model="row.include" :aria-label="'include ' + row.video.title"></td>
              <td x-text="row.video.playlist_index ?? ''"></td>
              <td><template x-if="row.video.title === row.video.id"><span class="muted">unavailable video</span></template><a x-show="row.video.title !== row.video.id" :href="row.video.url" target="_blank" rel="noopener" x-text="row.video.title"></a>
                  <br><span class="muted" x-text="fmtDuration(row.video.duration)"></span></td>
              <td>
                <template x-if="kind === 'sonarr'">
                  <fieldset role="group">
                    <input type="number" min="0" placeholder="S" :aria-label="'season for ' + row.video.title" x-model.number="row.season" :disabled="!series">
                    <input type="number" min="0" placeholder="E" :aria-label="'episode for ' + row.video.title" x-model.number="row.number" :disabled="!series">
                  </fieldset>
                </template>
                <template x-if="kind === 'radarr'">
                  <div class="rel">
                    <input type="search" x-model="row.movieQuery" @input.debounce.300ms="searchMovies(row)" placeholder="search Radarr" autocomplete="off" :aria-label="'movie for ' + row.video.title" role="combobox" aria-autocomplete="list" :aria-expanded="row.movieResults.length > 0" @keydown.down.prevent="row.hi = Math.min((row.hi ?? 0) + 1, row.movieResults.length - 1)" @keydown.up.prevent="row.hi = Math.max((row.hi ?? 0) - 1, 0)" @keydown.enter.prevent="row.movieResults[row.hi ?? 0] && pickMovie(row, row.movieResults[row.hi ?? 0])" @keydown.escape="row.movieResults = []">
                    <ul class="results" role="listbox" x-show="row.movieResults.length" @click.outside="row.movieResults = []">
                      <template x-for="(m, i) in row.movieResults" :key="m.id">
                        <li role="option" :aria-selected="i === (row.hi ?? 0)" @mouseenter="row.hi = i" @click="pickMovie(row, m)"><span x-text="m.title"></span> <span class="muted" x-text="m.year ? '(' + m.year + ')' : ''"></span></li>
                      </template>
                    </ul>
                  </div>
                </template>
              </td>
              <td><span :class="rowStatus(row).warn ? 'warn' : (isReady(row) ? 'ok' : 'muted')" x-text="rowStatus(row).text"></span></td>
            </tr>
          </template>
        </tbody>
      </table></div>
      <div class="sticky-bar">
        <button type="button" @click="queue()" :disabled="queueing || !readyCount()" :aria-busy="queueing">
          Queue <span x-text="readyCount()"></span> <span x-text="readyCount() === 1 ? 'job' : 'jobs'"></span>
        </button>
        <span class="muted"><span x-text="rows.filter(r => r.include).length"></span> selected · <span x-text="readyCount()"></span> ready</span>
        <span class="notice" role="status" aria-live="polite" x-show="result" x-html="result" style="margin:0"></span>
        <span class="notice bad" role="alert" x-show="error && videos.length" x-text="error" style="margin:0"></span>
      </div>
    </div>
  </template>
</div>

<script>
function grabApp() {
  const connections = {{ connection_ids | tojson }};
  const kinds = {{ kinds | tojson }};
  return {
    url: '', resolving: false, error: '', videos: [], rows: [],
    connectionId: connections[0] ?? null, kind: connections.length ? kinds[connections[0]] : null,
    seriesQuery: '', seriesResults: [], hi: 0, series: null, episodes: [], seasons: [],
    bulk: { season: 1, start: 1, reverse: false }, queueing: false, result: '',
    init() {},
    async api(method, path, body) {
      const r = await fetch(path, { method, headers: { 'content-type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
      const data = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(typeof data.detail === 'string' ? data.detail : JSON.stringify(data.detail ?? data));
      return data;
    },
    async resolve() {
      this.error = ''; this.result = ''; this.resolving = true;
      try {
        this.videos = await this.api('POST', '/api/resolve', { url: this.url });
        this.rows = this.videos.map(v => ({ video: v, include: v.title !== v.id, season: null, number: null, movieId: null, movieLabel: '', movieQuery: '', movieResults: [] }));
        if (!this.videos.length) this.error = 'No videos found at that URL.';
      } catch (e) { this.error = e.message; this.videos = []; this.rows = []; }
      this.resolving = false;
    },
    connectionChanged() {
      this.kind = kinds[this.connectionId]; this.series = null; this.episodes = []; this.seasons = []; this.seriesQuery = ''; this.seriesResults = [];
      this.rows.forEach(r => { r.season = null; r.number = null; r.movieId = null; r.movieLabel = ''; });
    },
    async searchSeries() {
      if (!this.seriesQuery.trim()) { this.seriesResults = []; return; }
      this.hi = 0;
      try { this.seriesResults = await this.api('GET', `/api/connections/${this.connectionId}/series?q=${encodeURIComponent(this.seriesQuery)}`); }
      catch (e) { this.error = e.message; }
    },
    async pickSeries(s) {
      this.series = s; this.seriesQuery = s.title; this.seriesResults = []; this.error = '';
      try {
        this.episodes = await this.api('GET', `/api/connections/${this.connectionId}/series/${s.id}/episodes`);
        this.seasons = [...new Set(this.episodes.map(e => e.season_number))].sort((a, b) => a - b);
        const latest = this.seasons.length ? this.seasons[this.seasons.length - 1] : 1;
        this.bulk.season = latest;
        const inSeason = this.episodes.filter(e => e.season_number === latest && !e.has_file);
        this.bulk.start = inSeason.length ? inSeason[0].episode_number : 1;
      } catch (e) { this.error = e.message; this.episodes = []; this.seasons = []; }
    },
    fillSequential() {
      let n = this.bulk.start;
      const rows = this.bulk.reverse ? [...this.rows].reverse() : this.rows;
      rows.forEach(r => { if (r.include) { r.season = this.bulk.season; r.number = n++; } });
      // episodes that already have a file are not worth a download: untick them
      rows.forEach(r => { const e = this.episodeFor(r); if (e && e.has_file) r.include = false; });
    },
    episodeFor(row) {
      if (row.season == null || row.number == null) return null;
      return this.episodes.find(e => e.season_number === row.season && e.episode_number === row.number) ?? null;
    },
    async searchMovies(row) {
      if (!row.movieQuery.trim()) { row.movieResults = []; return; }
      row.hi = 0;
      try { row.movieResults = await this.api('GET', `/api/connections/${this.connectionId}/movies?q=${encodeURIComponent(row.movieQuery)}`); }
      catch (e) { this.error = e.message; }
    },
    pickMovie(row, m) { row.movieId = m.id; row.movieLabel = m.title + (m.year ? ` (${m.year})` : ''); row.movieQuery = row.movieLabel; row.movieResults = []; row.movieHasFile = m.has_file; if (m.has_file) row.include = false; },
    rowStatus(row) {
      if (!row.include) return { text: 'skipped', warn: false };
      if (this.kind === 'sonarr') {
        if (!this.series) return { text: 'pick a series', warn: true };
        if (row.season == null || row.number == null) return { text: 'set S/E', warn: true };
        const e = this.episodeFor(row);
        if (!e) return { text: `S${row.season}E${row.number} not in Sonarr`, warn: true };
        return { text: (e.has_file ? 'has file · ' : '') + (e.title || 'ready'), warn: e.has_file };
      }
      if (!row.movieId) return { text: 'pick a movie', warn: true };
      return { text: row.movieHasFile ? 'has file' : 'ready', warn: !!row.movieHasFile };
    },
    isReady(row) {
      if (!row.include) return false;
      return this.kind === 'sonarr' ? !!this.episodeFor(row) : !!row.movieId;
    },
    readyCount() { return this.rows.filter(r => this.isReady(r)).length; },
    fmtDuration(s) { if (!s) return ''; const m = Math.floor(s / 60), r = s % 60; return `${m}:${String(r).padStart(2, '0')}`; },
    async queue() {
      this.queueing = true; this.result = ''; this.error = '';
      const jobs = this.rows.filter(r => this.isReady(r)).map(r => {
        const target = this.kind === 'sonarr'
          ? (() => { const e = this.episodeFor(r); return { kind: 'episode', series_id: this.series.id, episode_ids: [e.id], label: `${this.series.title} S${String(r.season).padStart(2, '0')}E${String(r.number).padStart(2, '0')}${e.title ? ' - ' + e.title : ''}`.slice(0, 300) }; })()
          : { kind: 'movie', movie_id: r.movieId, label: (r.movieLabel || '').slice(0, 300) };
        return { connection_id: this.connectionId, target, video: { url: r.video.url, id: r.video.id, title: r.video.title } };
      });
      try {
        const created = await this.api('POST', '/api/jobs', jobs);
        this.result = `Queued ${created.length} ${created.length === 1 ? 'job' : 'jobs'}. <a href="/activity">Open Activity</a>.`;
        this.rows.forEach(r => { if (this.isReady(r)) r.include = false; });
      } catch (e) { this.error = e.message; }
      this.queueing = false;
    },
  };
}
</script>
{% endblock %}
