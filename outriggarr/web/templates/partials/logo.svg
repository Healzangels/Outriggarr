<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="28" height="28" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d3b5c"/>
      <stop offset="1" stop-color="#1aa6b7"/>
    </linearGradient>
  </defs>

  <!-- badge -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- water -->
  <path d="M 88 478 q 24 -16 48 0 t 48 0 t 48 0 t 48 0 t 48 0 t 48 0 t 48 0"
        fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="10" stroke-linecap="round"/>

  <g fill="#ffffff" stroke="#ffffff" stroke-linejoin="round" stroke-linecap="round">
    <!-- mast -->
    <line x1="232" y1="90" x2="232" y2="332" stroke-width="14" fill="none"/>

    <!-- sail (doubles as a play glyph) -->
    <path d="M 250 100 L 250 286 L 396 214 Z" stroke-width="12"/>

    <!-- main hull: crescent with upswept pointed ends -->
    <path d="M 66 292
             C 130 330, 382 330, 446 292
             C 434 352, 336 386, 256 386
             C 176 386, 78 352, 66 292 Z" stroke-width="6"/>

    <!-- spars to the outrigger float -->
    <line x1="170" y1="372" x2="170" y2="436" stroke-width="14" fill="none"/>
    <line x1="300" y1="378" x2="300" y2="436" stroke-width="14" fill="none"/>

    <!-- outrigger float -->
    <path d="M 122 428
             C 160 416, 310 416, 348 428
             C 334 446, 290 452, 235 452
             C 180 452, 136 446, 122 428 Z" stroke-width="6"/>
  </g>
</svg>
