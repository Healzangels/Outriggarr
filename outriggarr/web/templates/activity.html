{% extends "base.html" %}
{% block title %}Activity · Outriggarr{% endblock %}
{% block content %}
<div class="page-header">
  <div><h2>Activity</h2><p class="sub">Every job, newest first. Refreshes every 3 seconds.</p></div>
</div>
<nav class="tabs" aria-label="views">
  {% for f in filters %}
    <a href="/activity?view={{ f }}" {% if f == view %}aria-current="page"{% endif %}>{{ f }}<span class="count">{{ counts[f] }}</span></a>
  {% endfor %}
</nav>
<div id="jobs" hx-get="/activity/rows?view={{ view }}" hx-trigger="every 3s" hx-swap="innerHTML">
  {% include "partials/jobs_table.html" %}
</div>
{% endblock %}
