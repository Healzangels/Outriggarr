{% extends "base.html" %}
{% block title %}Activity · Outriggarr{% endblock %}
{% block content %}
<h2>Activity</h2>
<p>
  {% for f in filters %}
    <a href="/activity?view={{ f }}" {% if f == view %}aria-current="page"{% endif %}>{{ f }}</a>{% if not loop.last %} · {% endif %}
  {% endfor %}
</p>
<div id="jobs" hx-get="/activity/rows?view={{ view }}" hx-trigger="every 3s" hx-swap="innerHTML">
  {% include "partials/jobs_table.html" %}
</div>
{% endblock %}
