{% extends "base.html" %}
{% block title %}Subscribe · Outriggarr{% endblock %}
{% block content %}
<h2>Subscribe: {{ title or ("series " ~ series_id) }}</h2>
{% if error %}<p class="warn">{{ error }}</p>{% endif %}
<form method="post" action="/series/{{ series_id }}/subscribe">
  {% include "partials/subscription_fields.html" %}
  <button type="submit">Subscribe</button> <a href="/series" role="button" class="secondary outline">Cancel</a>
</form>
{% endblock %}
